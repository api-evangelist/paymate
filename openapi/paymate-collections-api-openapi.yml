                        type: number
                        x-precision: 18,2
                        description: Service Tax on service charge
                      BankReferenceNo:
                        type: string
                        maxLength: 20
                        description: Reference number from the bank
                      SettlementStatus:
                        type: string
                        maxLength: 3
                        description: Settlement Status Code
                      SettlementRemarks:
                        type: string
                        maxLength: 500
                        description: Success
                      SettlementMode:
                        type: string
                        maxLength: 3
                        description: EFT
                      SettlementDateTime:
                        type: string
                        description: Date Time
                  RefundDetails:
                    type: object
                    description: It will contain the refund details if the settlement failed. Refer RefundDetails Object
