                      description: 'Attachments need to be converted to byte array and then needs to be encoded as base64 string, and then can be passed in DocumentProof. Ex. Electricity.png. Allowed file type: png, jpeg, jpg, gif and pdf'
                      x-possible-values: '[''png'', ''jpeg'', ''jpg'', ''gif'', ''pdf'']'
                    FileName:
                      type: string
                      maxLength: 100
                      description: 'Provide file name with file extension. Ex. GSTCertificate.png. Allowed file type: png, jpeg, jpg, gif and pdf'
                      x-possible-values: '[''png'', ''jpeg'', ''jpg'', ''gif'', ''pdf'']'
                  required:
                  - DocumentType
                  - Address
                  - City
                  - PinCode
                  - Country
                  - DocumentProof
                  - FileName
