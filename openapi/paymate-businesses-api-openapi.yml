      - ae
      - au
      - my
      - om
      - sg
      - za
      responses:
        '200':
          description: PayMate response envelope. Business outcome is carried in StatusCode; see errors/paymate-error-codes.yml.
          content:
            application/json:
              schema:
                type: object
                properties:
                  StatusCode:
                    type: string
                    maxLength: 3
                    description: Status of the Request
                  Description:
                    type: string
                    maxLength: 300
                    description: Status Description
                  DetailedSummary:
                    type: object
                    description: This will be used to show Business information. Refer DetailedSummary Object
                    properties:
                      BusinessName:
                        type: string
                        maxLength: 100
                        description: Name of the business
                      BusinessCode:
                        type: string
                        maxLength: 30
                        description: Business unique reference no. on partner system
                      ContactpersonName:
                        type: string
                        maxLength: 100
                        description: Contact's person first name
                      BusinessEmailAddress:
                        type: string
                        maxLength: 240
                        description: Business Email which will be used for all future communication
                      ISDCode:
                        type: string
                        maxLength: 4
                        description: Country ISD code
                      MobileNumber:
                        type: string
                        pattern: ^[0-9]+$
                        maxLength: 10
                        description: Business Mobile number
                      WebsiteAddress:
                        type: string
                        maxLength: 100
                        description: Business website details
                      BusinessDescription:
                        type: string
                        maxLength: 500
                        description: Short description about the business
                      ContactKYCRequired:
                        type: string
                        maxLength: 1
                        description: Y – if Business wants their vendors to perform the KYC, N – Otherwise
                      BusinessStatus:
                        type: string
                        maxLength: 3
                        description: Current Status of the Business
                      StatusRemark:
                        type: string
                        maxLength: 500
                        description: Status Description
                      RegistrationDate:
                        type: string
                        description: Business's Registration Date
                      BusinessXpressID:
                        type: string
                        maxLength: 15
                        description: Business Unique reference no at PayMate end
                      XpressAccountNo:
                        type: string
                        maxLength: 50
