                        description: Current Balance in the PayMate Xpress Account
                      ServiceType:
                        type: string
                        maxLength: 20
                        description: Assigned Service Type
                      PaymentMode:
                        type: string
                        maxLength: 15
                        description: Current assigned Payment Mode
                      ProcessingRate:
                        type: number
                        x-precision: 18,2
                        description: MDR for each payment mode
                      issuersCode:
