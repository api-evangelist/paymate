  /v1/MakePayment:
    post:
      operationId: MakePayments
      summary: Make Payments
      description: This method is used to make payment request to vendors which you have registered on “PayMate”. The method
        returns the Transaction Reference Number, Net Amount and Count on successful payment request creation.
      tags:
      - Payments
      x-regions:
      - ae
      - au
      - my
      - om
      - sg
      - za
      responses:
        '200':
          description: PayMate response envelope. Business outcome is carried in StatusCode; see errors/paymate-error-codes.yml.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                StatusCode: '000'
                Description: Your request has been processed successfully.
                DetailedSummary:
                  TransactionDetails:
                  - OrderID: CR000013459
                    PayMateRequestNo: '105818124721'
                    TransactionStatus: '000'
                    StatusMessage: Transaction booked successfully
                    PayableAmount: 9950
                  - OrderID: CR000013457
                    PayMateRequestNo: null
                    TransactionStatus: '301'
                    StatusMessage: Orderid already exists
                    PayableAmount: null
                  PaymentURL: https://dev.paymate.in/beta/PMX3.0/SenderAuthentication.aspx?guid=22D7C50397DEBB26833470301574BEB3&prakriya=07CAA0832C2DF798703C660211FBCC2A&bhugtanprakriya=E9F8A265F298DBA5CAED23BADF2FFF57
                  AcceptCount: '1'
                  RejectCount: '1'
                  NetAmount: '9950.00'
                  Status: '428'
        '401':
          description: Empty/invalid header credentials (StatusCode 106), observed on an unauthenticated probe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                RequestID:
                  type: string
                  maxLength: 30
                  description: A unique Request no from the partner to track the request
                BusinessCode:
                  type: string
                  maxLength: 30
                BusinessXpressID:
                  type: string
                  maxLength: 15
                PaymentMode:
                  type: string
                  maxLength: 15
                  description: Payment mode to be used for making payments. Options will be XpressAccount, CreditCard, DebitCard
                    or NetBanking
                  x-possible-values: '[''CreditCard'',''DebitCard'',''Netbanking'',''XpressAccount'']'
                DebitAccount:
                  type: string
                  maxLength: 30
                  description: 'Credit/Debit Card: 16 digit card number XpressAccount: Send issued XpresssAccount Number If
                    CardReferenceNo is passed then this is optional else required'
                ExpiryMonth:
                  type: string
                  pattern: ^[0-9]+$
                  maxLength: 2
                  description: If CardReferenceNo is passed then this is optional else required
                ExpiryYear:
                  type: string
                  pattern: ^[0-9]+$
                  maxLength: 4
                  description: If CardReferenceNo is passed then this is optional else required
                CVV:
                  type: string
                  pattern: ^[0-9]+$
                  maxLength: 3
                  description: If CardReferenceNo is passed then this is optional else required
                Network:
                  type: string
                  maxLength: 15
                  description: If CardReferenceNo is passed then this is optional else required
                  x-possible-values: '[''VISA'', ''MASTERCARD'', ''AMEX'']'
                CardHolderName:
                  type: string
                  maxLength: 50
                  description: Name on Card If CardReferenceNo is passed then this is optional else required
                IssuingBank:
                  type: string
                  maxLength: 100
                  description: Name of the card issuer If CardReferenceNo is passed then this is optional else required
                CardReferenceNo:
                  type: string
                  maxLength: 20
                  description: Card reference number of the saved card If DebitAccount and other info is passed then this
                    is optional else required
                TransactionDetails:
                  type: object
                  description: All the transaction related information need to share in TransactionDetails section. Refer
                    TransactionDetails Object
                Invoice:
                  type: object
                  description: Invoice related information and payable amount need to pass in invoice section. Refer Invoice
                    object
                DebitNote:
                  type: object
                  description: Advance payment information need to send in DebitNote section. Refer DebitNote object
              required:
              - RequestID
              - PaymentMode
              - TransactionDetails
              - Invoice
              - DebitNote
