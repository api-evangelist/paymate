                  properties:
                    DocumentType:
                      type: string
                      maxLength: 30
                      description: Refer DocumentType Enum
                    Address:
                      type: string
                      maxLength: 500
                      description: 'Complete address of the business. Note: Except District name and state'
                    City:
                      type: string
                      maxLength: 50
                      description: City name
                    PinCode:
                      type: string
                      pattern: ^[0-9]+$
                      maxLength: 6
                      description: PinCode of the City. System will store district name and state on the pincode input
                    Country:
                      type: string
                      maxLength: 3
                      description: ISO code of country
                    DocumentProof:
                      type: string
                      x-declared-type: AN(MAX)
                      description: 'Attachments need to be converted to byte array and then needs to be encoded as base64
                        string, and then can be passed in DocumentProof. Ex. Electricity.png. Allowed file type: png, jpeg,
                        jpg, gif and pdf'
                      x-possible-values: '[''png'', ''jpeg'', ''jpg'', ''gif'', ''pdf'']'
                    FileName:
                      type: string
                      maxLength: 100
                      description: 'Provide file name with file extension. Ex. GSTCertificate.png. Allowed file type: png,
                        jpeg, jpg, gif and pdf'
                      x-possible-values: '[''png'', ''jpeg'', ''jpg'', ''gif'', ''pdf'']'
                  required:
                  - DocumentType
                  - Address
                  - City
                  - PinCode
                  - Country
                  - DocumentProof
                  - FileName
              required:
              - BusinessNature
              - BusinessProof
              - AddressProof
            example:
              Details:
                RequestID: CRD0000055
                BusinessCode: CRD0000055
                BusinessXpressID: CRD0000055
                ContactReferenceCode: ''
                ContactXpressID: ''
                BusinessNature: Proprietorship
                BusinessProof:
                  DocumentType: TradeLicense
                  DocumentNumber: 18AABCU9603R1ZM
