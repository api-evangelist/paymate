                      type: string
                      maxLength: 100
                      description: 'Name on the Business Proof Document. Note: Name on the document must be related to business'
                    DocumentProof:
                      type: string
                      x-declared-type: AN(MAX)
                      description: Attachments need to be converted to byte array and then needs to be encoded as base64 string
                        , and then can be passed in DocumentProof
                    FileName:
                      type: string
                      maxLength: 100
