  /v1/contactboarding:
    post:
      operationId: ContactBoarding
      summary: Contact Boarding
      description: Use this method to add your vendors and customers as Contacts on your PayMate account. While adding a vendor,
        please provide the vendor's account details also. When adding a customer provide an email address for the customer
        which will be used for communication.
      tags:
      - Contacts
      x-regions:
      - ae
      - au
      - my
      - om
      - sg
      - za
      responses:
        '200':
          description: PayMate response envelope. Business outcome is carried in StatusCode; see errors/paymate-error-codes.yml.
          content:
            application/json:
              schema:
                type: object
                properties:
                  RequestID:
                    type: string
                    maxLength: 30
                    description: Sent during request
                  StatusCode:
                    type: string
                    maxLength: 3
                    description: Status of the Request
                  Description:
                    type: string
                    maxLength: 300
                    description: Status Description
                  DetailedSummary:
                    type: object
                    description: This will be used to show Contact status and respond. Refer DetailedSummary Object
                    properties:
                      BusinessCode:
                        type: string
                        maxLength: 30
                        description: Business unique reference no. on partner system.
                      BusinessXpressID:
                        type: string
                        maxLength: 15
                        description: Business Unique Relationship no which was issued at the time of boarding.
                      ReferenceCode:
                        type: string
                        maxLength: 30
                        description: Sent during request
                      ContactXpressID:
                        type: string
                        maxLength: 15
                        description: Business Identification at PayMate side
                      Status:
                        type: string
                        maxLength: 20
                        description: Current status of the Contact
                      Message:
                        type: string
                        maxLength: 500
                        description: Status description
              example:
                RequestID: '1234567899876'
                StatusCode: '000'
                Description: Your request has been processed successfully
                DetailedSummary:
                - BusinessCode: ALPHA
                  BusinessXpressID: TDS0223444
                  ReferenceCode: C00004
                  ContactXpressID: ASHF0112223
                  Status: '300'
                  Message: Contact has been added successfully
        '401':
          description: Empty/invalid header credentials (StatusCode 106), observed on an unauthenticated probe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                RequestID:
                  type: string
                  maxLength: 30
                  description: A unique RequestID for Identifying the request.
                ContactInformation:
                  type: object
                  description: Contact basic information will come under ContactInformation object. Refer ContactInformation
                    Object
                  properties:
                    BusinessCode:
                      type: string
                      maxLength: 30
                      description: Business unique reference no. on partner system. Parameter is mandatory if business is
                        not sending issued BusinessXpressID
                    BusinessXpressID:
                      type: string
                      maxLength: 15
                      description: Business Unique Relationship no issued by PayMate. Parameter is mandatory if business is
                        not sending registered BusinessCode
                    CompanyRegistrationNo:
                      type: string
                      maxLength: 30
                      description: Company Registration no issued by the government. If registration number is provided by
                        the partner then PayMate will perform the business KYC in real time. if the registration number is
                        not provided then the Partner will have to use the BuyerSupplierKYC and ShareholderDetails API method
                        for KYC verification.
                    CompanyName:
                      type: string
                      maxLength: 100
                      description: Contact's company name as per the government record
                      x-possible-values: Special characters allowed are . @ & ! ' _ - / ( )
                    CompanyNickName:
                      type: string
                      maxLength: 20
                      description: Nick name of the company
                    ReferenceCode:
                      type: string
                      maxLength: 30
                      description: Contact unique reference no. on partner system.
                    ContactPersonName:
                      type: string
                      maxLength: 250
                      description: Name of the contact person.
                    CompanyEmailAddress:
                      type: string
                      maxLength: 240
                      description: Contact's emails address.
                    CountryCode:
                      type: string
                      maxLength: 3
                      description: Country code as per the Country method. Please refer the API of the CountryInformation
                    ISDCode:
                      type: string
                      maxLength: 4
                      description: Country ISD code
                      x-possible-values: + 0-9
                    MobileNumber:
                      type: string
                      pattern: ^[0-9]+$
                      maxLength: 10
                      description: Contact Mobile Number.
                    NotificationEmailAddress:
                      type: string
                      maxLength: 1200
                      description: Contact email Address. Pass this parameter only when change is required
                    CompanyWebsite:
                      type: string
                      maxLength: 250
                      description: Website of the company.
                    CompanyDescription:
                      type: string
                      maxLength: 500
                      description: Description of the company
                    ContactType:
                      type: string
                      maxLength: 10
                      description: Please refer the API of the ContactType.
                      x-possible-values: Buyer, Supplier, Both
                  required:
                  - CompanyName
                  - ReferenceCode
                  - ContactPersonName
                  - CompanyEmailAddress
                  - ContactType
                BankAccountDetails:
                  type: object
                  description: Beneficiary Bank Name, IBAN and Currency Code will come under BankAccountDetails Object. Refer
                    BankAccountDetails Object
                  properties:
                    AccountHolderName:
                      type: string
                      maxLength: 100
                      description: Name of the person or business that owns the bank account.
                    AccountNo:
                      type: string
                      maxLength: 30
                      description: Contact's Account number
                    CurrencyCode:
                      type: string
                      maxLength: 3
                      description: Three letter ISO code for the currency paid out to the bank account
                    RoutingNumber:
                      type: string
                      pattern: ^[0-9]+$
                      maxLength: 9
                      description: The routing transit number for the bank account. If mandatory by bank then send with account
                        details
                    BICCode:
                      type: string
                      maxLength: 11
                      description: Bank identifier code
                    BranchCity:
                      type: string
                      maxLength: 50
                      description: Name of the bank branch
                      x-possible-values: A-Z, Space
                    CountryCode:
                      type: string
                      description: Three letter ISO code representing the country the bank account is located in
                  required:
                  - AccountHolderName
                  - AccountNo
                  - BICCode
              required:
              - RequestID
              - ContactInformation
              - BankAccountDetails
            example:
              RequestID: '12345678987654321'
              ContactDetails:
              - ContactInformation:
                  BusinessCode: ALPHA
                  BusinessXpressID: ''
                  CompanyRegistrationNo: '8765432123'
                  CompanyName: Alfala Technologies
                  CompanyNickName: ''
                  ReferenceCode: ALFTECH
                  ContactPersonName: Sheikh Mohammad Salaman Bin Abdul Aziz
                  CompanyEmailAddress: alfala@yopmail.com
                  CountryCode: MYS
                  ISDCode: '+60'
                  MobileNumber: '196090811'
                  CompanyWebsite: ''
                  CompanyDescription: ''
                  ContactType: Supplier
                BankAccountDetails:
                  AccountHolderName: Supernet Services
                  AccountNo: '565343423'
                  CurrencyCode: MYR
                  RoutingNumber: ''
                  BICCode: DBSSSGSG
                  BranchCity: ''
                  CountryCode: MYS
