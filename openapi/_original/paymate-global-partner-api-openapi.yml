                  type: string
                  maxLength: 3
                  description: 3 digit country iso code
                CardType:
                  type: string
                  maxLength: 20
                  description: Card Type
                  x-possible-values: '[''CreditCard'', ''DebitCard'']'
                ReturnURL:
                  type: string
                  maxLength: 200
                  description: URL to be redirected after the card addition is completed
              required:
              - RequestID
              - CardNumber
              - ExpiryMonth
              - ExpiryYear
              - CVV
              - Network
              - CardHolderName
              - IssuingBank
              - CardType
              - ReturnURL
