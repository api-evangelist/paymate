  /v1/VendorPayment:
    post:
      operationId: VendorPayments
      summary: Vendor Payments
      description: This method is used to make payment request to vendors which you have registered on “DuNoMo”. The method
        returns the Transaction Reference Number, Net Amount and Count on successful payment request creation.
      tags:
      - Payments
      x-regions:
      - au
      responses:
        '200':
          description: PayMate response envelope. Business outcome is carried in StatusCode; see errors/paymate-error-codes.yml.
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example:
                StatusCode: '000'
                Description: Your request has been processed successfully.
                DetailedSummary:
                  TransactionDetails:
                  - OrderID: CR000013459
                    PayMateRequestNo: '105818124721'
                    TransactionStatus: '000'
                    StatusMessage: Transaction booked successfully
                    PayableAmount: 9950
                  - OrderID: CR000013457
                    PayMateRequestNo: null
                    TransactionStatus: '301'
                    StatusMessage: Orderid already exists
                    PayableAmount: null
                  PaymentURL: https://dev.paymate.in/beta/PMX3.0/SenderAuthentication.aspx?guid=22D7C50397DEBB26833470301574BEB3&prakriya=07CAA0832C2DF798703C660211FBCC2A&bhugtanprakriya=E9F8A265F298DBA5CAED23BADF2FFF57
                  AcceptCount: '1'
                  RejectCount: '1'
                  NetAmount: '9950.00'
                  Status: '428'
        '401':
          description: Empty/invalid header credentials (StatusCode 106), observed on an unauthenticated probe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                RequestID:
                  type: string
                  maxLength: 30
                  description: A unique Request no from the partner to track the request
                BusinessCode:
                  type: string
                  maxLength: 30
                  description: Business unique reference no. on partner system. Parameter is mandatory if business is not
                    sending issued BusinessXpressID
                BusinessXpressID:
                  type: string
                  maxLength: 15
                  description: Business Unique Relationship no issued by PayMate. Parameter is mandatory if business is not
                    sending
                PaymentMode:
                  type: string
                  maxLength: 15
                  description: Payment mode to be used for making payments. Options will be XpressAccount, CreditCard, DebitCard
                    or NetBanking
                  x-possible-values: '[''CreditCard'',''DebitCard'',''Netbanking'',''XpressAccount'']'
                TransactionDetails:
                  type: object
                  description: All the transaction related information need to share in TransactionDetails section. Refer
                    TransactionDetails Object
                  properties:
                    OrderID:
                      type: string
                      maxLength: 30
                      description: Business generated OrderID
                    CompanyName:
                      type: string
                      maxLength: 100
                      description: Contact's Company name if provided will be validated against the company name stored at
                        DuNoMo
                    ReferenceCode:
                      type: string
                      maxLength: 30
                      description: If ContactXpressID passed, then this is optional, else Required.
                    ContactXpressID:
                      type: string
                      maxLength: 15
                      description: If ReferenceCode passed, then this is optional, else Required.
                    NotificationEmailAddress:
                      type: string
                      maxLength: 1200
                      description: NotificationEmailAddress will use to send payment notification to the supplier
                      x-possible-values: Business can use up to 5 email address separated by(,)
                    PaymentType:
                      type: string
                      maxLength: 15
                      description: Purpose of payment. Please refer Get PaymentTypes api to get the payment type list
                      x-possible-values: '[''POS-Merchant Settlements'',''RNT-Rent Payments'',''UTL-Utility'',''GDE-Goods
                        Sold'',''STR-Travel'',''FIS-Financial Services'',''GOS-Government Goods and Services Embassies'',''GRI-Government
                        Related Income Taxes Tariffs Capital Transfers'',''GDI-Goods Bought'']'
                    AccountNo:
                      type: string
                      maxLength: 30
                      description: Account no of the beneficiary. if provided will be validated against the AccountNo stored
                        at DuNoMo
                    RoutingNumber:
                      type: string
                      pattern: ^[0-9]+$
                      maxLength: 9
                      description: The routing transit number for the bank account. If mandatory by bank then send with account
                        details. if provided will be validated against the Routing Number stored at DuNoMo
                    BSBCode:
                      type: string
                      maxLength: 11
                      description: BSB Code
                    PaymentRemarks:
                      type: string
                      maxLength: 500
                      description: Remarks for the transaction
                  required:
                  - OrderID
                  - PaymentType
                Invoice:
                  type: object
                  description: Invoice related information and payable amount need to pass in invoice section. Refer Invoice
                    object
                  properties:
                    InvoiceNumber:
                      type: string
                      maxLength: 30
                      description: Invoice Number
                    InvoiceStartDate:
                      type: string
                      description: Invoice start date
                      x-possible-values: DD-MM-YYYY
                    InvoiceEndDate:
                      type: string
                      description: Invoice period end date
                      x-possible-values: DD-MM-YYYY
                    Amount:
                      type: number
                      x-precision: 18,2
                      description: Invoice amount
                    TDSAmount:
                      type: number
                      x-precision: 18,2
                      description: TDS amount on invoice
                    InvoiceReferenceNo:
                      type: string
                      maxLength: 30
                      description: Business can send their reference no if they are maintaining at their end
                  required:
                  - Amount
                DebitNote:
                  type: object
                  description: Advance payment information need to send in DebitNote section. Refer DebitNote object
                  properties:
                    DebitTransactionNo:
                      type: string
                      maxLength: 30
                      description: Advance payment UTR no
                    DebitDate:
                      type: string
                      description: Paid Date
                      x-possible-values: DD-MM-YYYY
                    DebitAmount:
                      type: number
                      x-precision: 18,2
                      description: Paid Amount
                    DebitReferenceNo:
                      type: string
                      maxLength: 30
                      description: Business can send their reference no if they are maintaining at their end
                    DebitRemarks:
                      type: string
                      maxLength: 500
                      description: Remarks against the advance payment
              required:
              - RequestID
              - PaymentMode
              - TransactionDetails
              - Invoice
              - DebitNote
            example:
              RequestID: '123456789'
              BusinessCode: ARFC1223
              BusinessXpressID: ''
              PaymentMode: CreditCard
              PaymentDetails:
              - TransactionDetails:
                  OrderID: CR000013454
                  CompanyName: Art & Craft
                  ReferenceCode: AC00001
                  ContactXpressID: ''
                  AccountNo: '453423123'
