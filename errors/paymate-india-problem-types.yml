method: searched
source: https://paymate.in/paymateapi/APIDoc.html#errorcodes
api: PayMate India Business Payments API (PMXClients)
format: proprietary-envelope
note: The legacy India API does not use RFC 9457. Each response carries XpressID, ErrorCode, ErrorDescription and
  Response; ErrorCode "000" is success. Codes 198-216 are payment lifecycle states (awaiting approval, sent to bank,
  returned from beneficiary, ...) rather than faults.
envelope:
  fields:
  - field: XpressID
    description: Account identifier echoed from the request header
  - field: ErrorCode
    description: Three-digit code; 000 = Success
  - field: ErrorDescription
    description: Human-readable description (max 100 chars)
  - field: Response
    description: Array of response data; empty when ErrorCode != 000
