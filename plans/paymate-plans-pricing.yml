    rtgs: free
    imps: 10 INR
    credit_card: 2.5% (2.25% on Enterprise Custom)
    debit_card: 1%
    net_banking: 30 INR
  receive_money:
    neft: free
    rtgs: free
    credit_card: 2.5% (2.25% on Enterprise Custom)
    debit_card: 1% (only above Rs. 2000)
    net_banking: 30 INR
    settlement: T+2, free
  constraints:
  - IMPS transactions are limited to Rs. 2 lacs per transaction.
  - Fees on a confirmed transaction are not returned even if the transaction is rejected, charged back,
    refunded or disputed.
