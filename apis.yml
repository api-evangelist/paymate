aid: paymate
name: PayMate
description: >-
  PayMate India Limited is a Mumbai-headquartered B2B payments and supply-chain finance platform that
  digitizes, automates and streamlines business payables and receivables. Enterprises use PayMate to pay
  vendors, GST and utility bills on commercial credit cards, to raise and collect invoice payment requests,
  to run maker/checker approval workflows, and to access working-capital credit and invoice discounting.
  The platform runs in India as PayMate and across Singapore, Malaysia, the UAE, Oman, Sri Lanka, Saudi
  Arabia, Australia and South Africa — where the Australian and South African deployments carry the DuNoMo
  brand. Two distinct API surfaces are published: the legacy India PayMate API (PMXClients WCF/JSON service)
  and the current Global Partner API, a v1 REST surface for business (KYB) onboarding, contact onboarding,
  commercial-card management, vendor payments, collection requests and reporting.
