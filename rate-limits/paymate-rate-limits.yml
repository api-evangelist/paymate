gaps:
- No per-second/per-minute request limit is published for either API.
- No rate-limit response headers, so a client cannot pace itself.
- No documented 429 behaviour or Retry-After guidance.
- Monthly quotas are commercial and enforced through billing (Rs. 10/transaction overage), not through the
  HTTP surface.
