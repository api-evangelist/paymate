note: >-
  PayMate publishes no HTTP rate limit — no requests-per-second/minute figure, no burst allowance, no
  X-RateLimit-*/RateLimit-*/Retry-After response header and no dedicated 429 status appear anywhere in either
  API's documentation, and none was observed on a live unauthenticated probe of
  https://api.paymate.my/v1/Countrylist on 2026-08-26. What PayMate does publish is a set of COMMERCIAL
  volume caps attached to the subscription plan, plus a source-address allowlist whose size is also a plan
  attribute. Those are recorded below because they are the real ceiling an integrator hits, but an agent gets
  no runtime signal that it is approaching one.
