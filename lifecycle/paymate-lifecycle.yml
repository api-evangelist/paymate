generational_change:
  observed: true
  note: >-
    PayMate has in effect shipped a second-generation API without announcing a deprecation. The India API
    (PMXClients, AES-256 encrypted payloads, MerchantIdentification/TerminalIdentification/XpressID headers,
    12 methods, examples dated 2018) and the Global Partner API (v1, secret API key, 25 operations, six
    regional hosts) are different products with different envelopes, different identifiers (XpressID vs
    PMXID/BusinessXpressID) and different error registries (58 codes vs 508). Neither documentation set
    references the other, and no migration guide exists. The India documentation page is still served and
    still the only PayMate API documentation reachable from paymate.in.
